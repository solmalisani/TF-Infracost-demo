name: Check Terraform drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect drift and create remediation plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    outputs:
      drift: ${{ steps.drift.outputs.detected }}
      drift_error: ${{ steps.drift.outputs.error }}
      remediation_error: ${{ steps.remediation.outputs.error }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Initialize Terraform
        uses: ./.github/actions/tf-init
        with:
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: "1.16.6"

      - name: Check for infrastructure drift
        id: drift
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            > drift-plan.txt 2>&1

          exit_code=$?

          cat drift-plan.txt

          echo "Terraform plan exit code: $exit_code"

          if [ "$exit_code" -eq 0 ]; then
            echo "detected=false" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected."

          elif [ "$exit_code" -eq 2 ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
            echo "Changes detected. Review the plan."

          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Generate remediation plan
        id: remediation
        if: steps.drift.outputs.detected == 'true'
        shell: bash
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color 2>&1 | tee remediation-plan.txt

          exit_code=${PIPESTATUS[0]}

          if [ "$exit_code" -eq 0 ]; then
            echo "error=false" >> "$GITHUB_OUTPUT"
          else
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "Terraform remediation plan failed."
          fi

      - name: Upload drift reports
        if: always() && steps.drift.outputs.detected == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: terraform-drift-reports
          path: drift-plan.txt
          retention-days: 7
          if-no-files-found: warn

  notify:
    name: Notify Slack
    runs-on: ubuntu-24.04
    needs: detect
    if: always() && (needs.detect.outputs.drift == 'true' || needs.detect.outputs.drift_error == 'true' || needs.detect.outputs.remediation_error == 'true' || needs.detect.result == 'failure')

    steps:
      - name: Format timestamp
        id: timestamp
        run: echo "formatted=$(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Send drift notification to Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "${{ needs.detect.outputs.drift == 'true' && needs.detect.outputs.remediation_error != 'true' && 'warning' || 'danger' }}"
                blocks:
                  - type: section
                    text:
                      type: mrkdwn
                      text: "${{ needs.detect.outputs.drift == 'true' && needs.detect.outputs.remediation_error != 'true' && ':warning: *Terraform drift detected*' || ':x: *Terraform drift check failed*' }}"
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Repository:*\n${{ github.repository }}"
                      - type: mrkdwn
                        text: "*Triggered by:*\n${{ github.actor }}"
                      - type: mrkdwn
                        text: "*Time:*\n${{ steps.timestamp.outputs.formatted }}"
                      - type: mrkdwn
                        text: "*Status:*\n${{ needs.detect.outputs.drift == 'true' && needs.detect.outputs.remediation_error == 'true' && 'Drift found; remediation plan failed' || needs.detect.outputs.drift == 'true' && 'Drift detected' || 'Check failed' }}"
                  - type: section
                    text:
                      type: mrkdwn
                      text: "${{ needs.detect.outputs.drift == 'true' && 'Changes may have been made to AWS outside Terraform. Review the reports and proposed remediation before making any changes.' || 'The drift check could not complete successfully. Review the workflow logs to identify the problem.' }}"
                  - type: section
                    text:
                      type: mrkdwn
                      text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|See more: drift report and logs>"
