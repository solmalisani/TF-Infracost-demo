name: Check Terraform drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect drift and create remediation plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    outputs:
      drift: ${{ steps.drift.outputs.detected }}
      drift_error: ${{ steps.drift.outputs.error }}
      remediation_error: ${{ steps.remediation.outputs.error }}

    steps:
      - name: Ensure drift runs from main
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Initialize Terraform
        uses: ./.github/actions/tf-init
        with:
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: "1.16.6"

      - name: Generate report timestamp
        id: report
        run: |
          echo "timestamp=$(TZ=Europe/Amsterdam date '+%Y-%m-%d-%H-%M')" >> "$GITHUB_OUTPUT"

      - name: Check for infrastructure drift
        id: drift
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            > "${{ steps.report.outputs.timestamp }}-drift-plan.txt" 2>&1

          exit_code=$?

          cat "${{ steps.report.outputs.timestamp }}-drift-plan.txt"

          echo "Terraform plan exit code: $exit_code"

          if [ "$exit_code" -eq 0 ]; then
            echo "detected=false" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected."

          elif [ "$exit_code" -eq 2 ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "error=false" >> "$GITHUB_OUTPUT"
            echo "Changes detected. Review the plan."

          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Generate remediation plan
        id: remediation
        if: steps.drift.outputs.detected == 'true'
        shell: bash
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color 2>&1 | tee remediation-plan.txt

          exit_code=${PIPESTATUS[0]}

          if [ "$exit_code" -eq 0 ]; then
            echo "error=false" >> "$GITHUB_OUTPUT"
          else
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "Terraform remediation plan failed."
          fi

      - name: Upload drift reports
        if: always() && steps.drift.outputs.detected == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.report.outputs.timestamp }}-terraform-drift-report
          path: ${{ steps.report.outputs.timestamp }}-drift-plan.txt
          retention-days: 7
          if-no-files-found: warn

  notify:
    name: Create issue and notify Slack
    runs-on: ubuntu-24.04
    needs: detect
    if: always() && (needs.detect.outputs.drift == 'true' || needs.detect.outputs.drift_error == 'true' || needs.detect.outputs.remediation_error == 'true' || needs.detect.result == 'failure')

    permissions:
      contents: read
      issues: write

    outputs:
      issue_url: ${{ steps.create_issue.outputs.issue_url }}

    steps:
      - name: Format timestamp
        id: timestamp
        run: |
          echo "formatted=$(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Download drift report
        if: needs.detect.outputs.drift == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.detect.outputs.report_timestamp }}-terraform-drift-report
          path: drift-report

      - name: Create GitHub issue for drift
        id: create_issue
        if: needs.detect.outputs.drift == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          REPORT_TIMESTAMP: ${{ needs.detect.outputs.report_timestamp }}
          REPORT_FILE: drift-report/${{ needs.detect.outputs.report_timestamp }}-drift-plan.txt
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETECTED_AT: ${{ steps.timestamp.outputs.formatted }}
        with:
          script: |
            const fs = require('fs');

            const reportPath = process.env.REPORT_FILE;
            if (!fs.existsSync(reportPath)) {
              throw new Error(`Terraform drift report not found: ${reportPath}`);
            }

            const fullPlan = fs.readFileSync(reportPath, 'utf8');
            const maxChars = 40000;
            const plan = fullPlan.length > maxChars
              ? fullPlan.slice(0, maxChars) + '\n\n[Report truncated. See the workflow run for the full output.]'
              : fullPlan;

            const body = [
              '## Terraform drift detected',
              '',
              'Terraform detected infrastructure changes that differ from the configured desired state.',
              '',
              `- **Repository:** ${context.repo.owner}/${context.repo.repo}`,
              `- **Detected at:** ${process.env.DETECTED_AT} (Europe/Amsterdam)`,
              `- **Workflow run:** ${process.env.WORKFLOW_URL}`,
              '',
              '## Next steps',
              '',
              '**If the change is intentional:**',
              '1. Update the corresponding Terraform (`.tf`) files to reflect the intended infrastructure state.',
              '2. Publish a pull request (PR) with those changes.',
              '3. Review and merge the PR according to your normal process.',
              '',
              '**If the change is not intentional:**',
              '1. Run the Terraform remediation workflow from the Actions tab to apply changes.',
              '',
              '## Terraform plan',
              '',
              '<details>',
              '<summary>Expand to view the detected changes</summary>',
              '',
              '```text',
              plan,
              '```',
              '',
              '</details>',
              '',
              '> The plan may contain sensitive infrastructure details. Handle this issue according to the repository access policy.'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform drift detected — ${process.env.REPORT_TIMESTAMP}`,
              body,
              labels: ['terraform-drift']
            }).catch(async (error) => {
              if (error.status === 422 && String(error.message).includes('label')) {
                return await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `Terraform drift detected — ${process.env.REPORT_TIMESTAMP}`,
                  body
                });
              }
              throw error;
            });

            core.setOutput('issue_url', issue.data.html_url);
            core.info(`Created drift issue: ${issue.data.html_url}`);

      - name: Send drift notification to Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ needs.detect.outputs.drift == 'true' && steps.create_issue.outputs.issue_url != '' && format('Terraform drift detected. More information: <{0}|GitHub issue>', steps.create_issue.outputs.issue_url) || needs.detect.outputs.drift == 'true' && 'Terraform drift detected, but the GitHub issue could not be created. Review the workflow run.' || 'Terraform drift check failed. Review the workflow logs.' }}"
            attachments:
              - color: "${{ needs.detect.outputs.drift == 'true' && needs.detect.outputs.remediation_error != 'true' && 'warning' || 'danger' }}"
                blocks:
                  - type: section
                    text:
                      type: mrkdwn
                      text: "${{ needs.detect.outputs.drift == 'true' && needs.detect.outputs.remediation_error != 'true' && ':warning: *Terraform drift detected*' || ':x: *Terraform drift check failed*' }}"
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Repository:*\n${{ github.repository }}"
                      - type: mrkdwn
                        text: "*Triggered by:*\n${{ github.actor }}"
                      - type: mrkdwn
                        text: "*Time:*\n${{ steps.timestamp.outputs.formatted }}"
                      - type: mrkdwn
                        text: "*Status:*\n${{ needs.detect.outputs.drift == 'true' && needs.detect.outputs.remediation_error == 'true' && 'Drift found; remediation plan failed' || needs.detect.outputs.drift == 'true' && 'Drift detected' || 'Check failed' }}"
                  - type: section
                    text:
                      type: mrkdwn
                      text: "${{ needs.detect.outputs.drift == 'true' && 'Changes may have been made to AWS outside Terraform. Review the proposed remediation before making any changes.' || 'The drift check could not complete successfully. Review the workflow logs to identify the problem.' }}"
                  - type: section
                    text:
                      type: mrkdwn
                      text: "${{ needs.detect.outputs.drift == 'true' && steps.create_issue.outputs.issue_url != '' && format('More information and the Terraform plan: <{0}|View GitHub issue>', steps.create_issue.outputs.issue_url) || needs.detect.outputs.drift == 'true' && 'The GitHub issue could not be created. Check the workflow run for details.' || format('<{0}|See workflow run and logs>', format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)) }}"
