
name: Terraform PR Checks

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.terraform.lock.hcl'
      - '**/*.tfbackend'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    container: ghcr.io/infracost/ci:2

    steps:
      - uses: actions/checkout@v7
        with:
          path: head

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - uses: infracost/actions/diff@v5
        with:
          api-key: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
          base-path: base
          head-path: head
