
name: Terraform PR Checks

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tfvars.json'
      - '**/.terraform.lock.hcl'
      - '**/*.tfbackend'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-26.04

    steps:
      - name: Initialize Terraform and configure AWS credentials
        uses: ./.github/actions/tf-init
        with:
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: "1.16.6"

      - name: Create Terraform plan
        id: plan
        working-directory: head
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color 2>&1 | tee tfplan.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Comment Terraform plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          PLAN_FILE: head/tfplan.txt
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- terraform-plan-comment -->';
            const outcome = process.env.PLAN_OUTCOME;
            let plan = '';

            if (fs.existsSync(process.env.PLAN_FILE)) {
              plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            }

            const status = outcome === 'success'
              ? 'Terraform plan completed'
              : 'Terraform plan failed';

            const maxLength = 60000;
            if (plan.length > maxLength) {
              plan = plan.slice(0, maxLength) +
                '\n\n... Output truncated. Check the workflow logs for the full plan.';
            }

            const body = [
              marker,
              `## ${status}`,
              '',
              '```text',
              plan || 'No plan output was produced.',
              '```',
              '',
              `Exit code: ${process.env.PLAN_EXIT_CODE || 'unknown'}`,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.body.includes(marker) &&
              comment.user.type === 'Bot'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
