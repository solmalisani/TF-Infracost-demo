name: deploy-infra

# Pull request: plan + cost estimate + comment (nothing is applied).
# Merge to main: plan + cost gate. Under the limit -> apply. Over the limit -> notify, wait for approval, then apply.
on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read
  pull-requests: write
  issues: write # the approval step uses an issue

concurrency:
  group: ${{ github.event_name == 'push' && 'terraform-infra' || format('plan-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      delta: ${{ steps.gate.outputs.delta }}
      limit: ${{ steps.gate.outputs.limit }}
      over_limit: ${{ steps.gate.outputs.over_limit }}
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout the previous version (cost baseline)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base

      - uses: ./.github/actions/tf-init
        with:
          aws-role: ${{ secrets.AWS_ROLE }}

      - name: Format and validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Plan
        working-directory: infra
        run: terraform plan -input=false -lock=${{ github.event_name == 'push' }} -out=tfplan

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Estimate the monthly cost change
        run: |
          infracost breakdown --path=base/infra --format=json --out-file=/tmp/infracost-base.json
          infracost diff --path=infra --format=json --compare-to=/tmp/infracost-base.json --out-file=/tmp/infracost.json

      - name: Cost gate
        id: gate
        env:
          THRESHOLD: ${{ vars.COST_THRESHOLD }}
        run: |
          delta=$(jq -r '.diffTotalMonthlyCost // "0"' /tmp/infracost.json)
          limit="${THRESHOLD:-0}"   # no variable set = any increase needs approval
          over=$(awk -v d="$delta" -v t="$limit" 'BEGIN { print (d+0 > t+0) ? "true" : "false" }')
          echo "delta=$delta" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "over_limit=$over" >> "$GITHUB_OUTPUT"
          echo "Monthly cost change: \$$delta (limit \$$limit). Over limit: $over" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$over" = "true" ]; then
            echo "::warning::Monthly cost increase of \$$delta is over the \$$limit limit and will need approval."
          fi

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            number="$PR_NUMBER"
          else
            number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Comment the cost breakdown on the pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          infracost comment github --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" --github-token="$GH_TOKEN" \
            --pull-request="$PR" --behavior=update

      - name: Comment the decision after merge
        if: github.event_name == 'push' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          DELTA: ${{ steps.gate.outputs.delta }}
          LIMIT: ${{ steps.gate.outputs.limit }}
          OVER: ${{ steps.gate.outputs.over_limit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OVER" = "true" ]; then
            msg="Cost change is +\$$DELTA/month, over the \$$LIMIT limit. Slack and email were sent and the deployment is **waiting for manual approval**: $RUN_URL"
          else
            msg="Cost change is +\$$DELTA/month, within the \$$LIMIT limit. Applying automatically: $RUN_URL"
          fi
          gh pr comment "$PR" --body "$msg"

      - name: Keep the plan for the apply job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  notify:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.over_limit == 'true'
    runs-on: ubuntu-24.04
    env:
      MESSAGE: |
        Terraform change needs approval: +$${{ needs.plan.outputs.delta }}/month (limit $${{ needs.plan.outputs.limit }}).
        Approve or deny it in the issue created by the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MESSAGE" '{text: $text}')" "$SLACK_WEBHOOK_URL"

      - name: Prepare the email
        run: echo "$MESSAGE" > /tmp/email.txt

      - name: Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Approval needed: infrastructure change over the cost limit"
          to: ${{ secrets.EMAIL_TO }}
          from: Terraform pipeline <${{ secrets.SMTP_USERNAME }}>
          body: file:///tmp/email.txt

  approve:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.over_limit == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: trstringer/manual-approval@v1
        timeout-minutes: 60 # the job keeps running while it waits, which uses your free Actions minutes
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.APPROVERS }}
          minimum-approvals: 1
          issue-title: "Approve infrastructure change (+$${{ needs.plan.outputs.delta }}/month)"
          issue-body: "The change is over the $${{ needs.plan.outputs.limit }} monthly limit. Reply **approve** to deploy it or **deny** to cancel. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  apply:
    needs: [plan, approve]
    if: ${{ always() && github.event_name == 'push' && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.approve.result) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/tf-init
        with:
          aws-role: ${{ secrets.AWS_ROLE }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Apply the approved plan
        working-directory: infra
        run: terraform apply -input=false tfplan
