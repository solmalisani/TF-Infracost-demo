
name: Terraform Main Deployment

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tfvars.json'
      - '.terraform.lock.hcl'
      - '**/*.tfbackend'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-main
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.6"
  INFRACOST_VERSION: "v2.17.0"
  COST_THRESHOLD: "50"

jobs:
  plan-and-estimate:
    runs-on: ubuntu-latest
    outputs:
      requires_approval: ${{ steps.cost.outputs.requires_approval }}
      cost_increase: ${{ steps.cost.outputs.cost_increase }}

    steps:
      - name: Checkout previous version
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.before }}
          path: base

      - name: Checkout merged version
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: head

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: head
        run: terraform init -input=false

      - name: Create Terraform plan
        working-directory: head
        run: terraform plan -input=false -out=tfplan

      - uses: infracost/actions/diff@v5
        with:
          api-key: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
          base-path: base
          head-path: head

      # - name: Export plan as JSON
