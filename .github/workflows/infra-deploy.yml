
name: Terraform PR deployment

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tfvars.json'
      - '**/.terraform.lock.hcl'
      - '**/*.tfbackend'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize Terraform and configure AWS credentials
        uses: ./.github/actions/tf-init
        with:
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: "1.16.6"

      - name: Terraform apply
        shell: bash
        run: |
          terraform apply -input=false -auto-approve -no-color

  notify:
    name: Notify Slack
    runs-on: ubuntu-26.04
    needs: deploy
    if: always()

    steps:
      - name: Send deployment result to Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "${{ needs.deploy.result == 'success' && 'good' || 'danger' }}"
                blocks:
                  - type: section
                    text:
                      type: mrkdwn
                      text: >-
                        ${{ needs.deploy.result == 'success' && ':white_check_mark: *Terraform deployment successful*' || ':x: *Terraform deployment failed*' }}
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Triggered by:*\n${{ github.actor }}"
                      - type: mrkdwn
                        text: "*Status:*\n${{ needs.deploy.result }}"
                      - type: mrkdwn
                        text: "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                      - type: mrkdwn
                        text: "*Time (UTC):*\n${{ github.event.head_commit.timestamp }}"
                  - type: section
                    text:
                      type: mrkdwn
                      text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|See more: deployment logs>"
